# OpenHAX fork CI, GPL-3.0-or-later.
name: OpenHAX source wheel
on:
  push:
    branches: [codex/paired-stream-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.9.5
          enable-cache: false
      - name: Install the repository dev interpreter
        run: uv python install 3.13.6
      - name: Synchronize immutable lock
        run: uv sync --locked
      - name: Check the changed library and regression fixture
        run: |
          uv run --locked ruff check src/colab_mcp/websocket_server.py tests/stream_cleanup_test.py
          uv run --locked ruff format --check src/colab_mcp/websocket_server.py tests/stream_cleanup_test.py
      - name: Run complete upstream test suite
        run: uv run --locked pytest -W always --junitxml=upstream-tests.xml
      - name: Build source-derived wheel
        run: |
          uv build --wheel --no-sources
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          wheel, = pathlib.Path('dist').glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              for license_file in ('LICENSE', 'NOTICE', 'COPYING', 'COPYING.LESSER', 'LICENSING.md'):
                  entry, = [name for name in names if name.endswith('/licenses/' + license_file)]
                  assert archive.read(entry) == pathlib.Path(license_file).read_bytes()
          pathlib.Path('wheel-receipt.json').write_text(json.dumps({
              'schema': 'openhax-library-wheel/v1', 'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'workflow_event_sha': os.environ['GITHUB_SHA'],
              'wheel': wheel.name, 'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
              'version': '1.0.1+openhax.cleanup.1', 'upstream_sha': 'b9ab3899e0f1fa493390b1fd6d54aa2e464ecdf1',
              'license': 'Apache-2.0 AND LGPL-3.0-or-later'
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openhax-colab-mcp-source-wheel
          path: |
            dist/*.whl
            wheel-receipt.json
            upstream-tests.xml
          if-no-files-found: error
          retention-days: 30
